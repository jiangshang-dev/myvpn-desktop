<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户 · MyVPN</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div id="app">
    <div id="page" data-nav="users" data-title="用户管理">
      <div class="toolbar">
        <input id="q" placeholder="搜索邮箱/昵称" style="padding:8px 12px;border:1px solid #d5e0d9;border-radius:8px">
        <button class="btn" onclick="load()">搜索</button>
      </div>
      <div class="card" style="margin-top:12px">
        <table>
          <thead><tr><th>邮箱</th><th>昵称</th><th>设备数</th><th>在线</th><th>到期</th><th>最近登录</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="./js/common.js"></script>
  <script>
    async function toggle(id, enabled) {
      await Admin.api("/api/admin/users/toggle", { method: "POST", body: JSON.stringify({ id, enabled }) });
      Admin.toast(enabled ? "已启用" : "已禁用");
      load();
    }
    async function load() {
      const q = document.getElementById("q").value;
      const rows = await Admin.api(`/api/admin/users?q=${encodeURIComponent(q)}`);
      document.getElementById("list").innerHTML = rows.map((r) => `
        <tr>
          <td>${Admin.esc(r.email)}</td><td>${Admin.esc(r.nickname)}</td>
          <td>${r.deviceCount}</td><td>${r.onlineCount}</td>
          <td>${Admin.fmt(r.planExpireAt) || "-"}</td><td>${Admin.fmt(r.lastLoginAt) || "-"}</td>
          <td>${r.enabled ? "正常" : "禁用"}</td>
          <td><button class="btn ${r.enabled ? "danger" : ""}" onclick="toggle(${r.id}, ${r.enabled ? 0 : 1})">${r.enabled ? "禁用" : "启用"}</button></td>
        </tr>`).join("");
    }
    document.addEventListener("admin:ready", load);
  </script>
</body>
</html>
